{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center my-4"><div class="col-12 col-md-8 col-lg-7"><div class="card shadow border-0 rounded-3 p-3 p-sm-4 p-lg-5 theme-surface">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4"><h3 class="h4 fw-bold theme-text mb-0">Update Product</h3><span class="badge rounded-pill text-bg-warning">Admin</span></div>
    <form action="{{ url_for('admin_edit_product', product_id=product.id) }}" method="POST" enctype="multipart/form-data">
        <div class="mb-3"><label class="form-label fw-bold">Product Name</label><input type="text" name="name" class="form-control" value="{{ product.name }}" required></div>
        <div class="row g-3"><div class="col-12 col-sm-6 mb-3"><label class="form-label fw-bold">Category</label><select name="category_id" class="form-select" required>{% for cat in categories %}<option value="{{ cat.id }}" {{ 'selected' if cat.id == product.category_id else '' }}>{{ cat.name }}</option>{% endfor %}</select></div><div class="col-12 col-sm-6 mb-3"><label class="form-label fw-bold">Brand</label><select name="brand_id" class="form-select" required>{% for brand in brands %}<option value="{{ brand.id }}" {{ 'selected' if brand.id == product.brand_id else '' }}>{{ brand.name }}</option>{% endfor %}</select></div></div>
        <div class="row g-3"><div class="col-12 col-sm-6 mb-3"><label class="form-label fw-bold">Actual Price (MRP)</label><input type="number" step="0.01" min="0" name="actual_price" class="form-control" value="{{ product.actual_price }}" required></div><div class="col-12 col-sm-6 mb-3"><label class="form-label fw-bold">Our Discount Price</label><input type="number" step="0.01" min="0" name="discount_price" class="form-control" value="{{ product.discount_price }}" required></div></div>
        <div class="mb-3 form-check"><input type="checkbox" name="is_stock" value="1" class="form-check-input" id="is_stock" {{ 'checked' if product.is_stock else '' }}><label class="form-check-label" for="is_stock">Available in stock</label></div>
        <div class="mb-4"><label class="form-label fw-bold">Replace Image <span class="text-muted fw-normal">(optional)</span></label><input type="file" name="image" class="form-control" accept="image/*"></div>
        <div class="d-flex flex-column flex-sm-row gap-2"><a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary flex-fill">Cancel</a><button type="submit" class="btn btn-danger flex-fill fw-bold">Save Changes</button></div>
    </form>
</div></div></div>
{% endblock %}
