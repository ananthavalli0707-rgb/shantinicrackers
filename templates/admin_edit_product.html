{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center my-4"><div class="col-md-7"><div class="card shadow border-0 p-4 bg-white">
    <h3 class="fw-bold text-dark mb-4">Update Product</h3>
    <form action="{{ url_for('admin_edit_product', product_id=product.id) }}" method="POST" enctype="multipart/form-data">
        <div class="mb-3"><label class="form-label fw-bold">Product Name</label><input type="text" name="name" class="form-control" value="{{ product.name }}" required></div>
        <div class="row"><div class="col mb-3"><label class="form-label fw-bold">Category</label><select name="category_id" class="form-select" required>{% for cat in categories %}<option value="{{ cat.id }}" {{ 'selected' if cat.id == product.category_id else '' }}>{{ cat.name }}</option>{% endfor %}</select></div><div class="col mb-3"><label class="form-label fw-bold">Brand</label><select name="brand_id" class="form-select" required>{% for brand in brands %}<option value="{{ brand.id }}" {{ 'selected' if brand.id == product.brand_id else '' }}>{{ brand.name }}</option>{% endfor %}</select></div></div>
        <div class="row"><div class="col mb-3"><label class="form-label fw-bold">Actual Price (MRP)</label><input type="number" step="0.01" min="0" name="actual_price" class="form-control" value="{{ product.actual_price }}" required></div><div class="col mb-3"><label class="form-label fw-bold">Our Discount Price</label><input type="number" step="0.01" min="0" name="discount_price" class="form-control" value="{{ product.discount_price }}" required></div></div>
        <div class="mb-3 form-check"><input type="checkbox" name="is_stock" value="1" class="form-check-input" id="is_stock" {{ 'checked' if product.is_stock else '' }}><label class="form-check-label" for="is_stock">Available in stock</label></div>
        <div class="mb-4"><label class="form-label fw-bold">Replace Image <span class="text-muted fw-normal">(optional)</span></label><input type="file" name="image" class="form-control" accept="image/*"></div>
        <div class="d-flex gap-2"><a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary w-50">Cancel</a><button type="submit" class="btn btn-dark w-50 fw-bold">Save Changes</button></div>
    </form>
</div></div></div>
{% endblock %}
