{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm text-center p-4 p-md-5 bg-white rounded-4">
            <div class="display-5 mb-3">✅</div>
            <h2 class="fw-bold mb-3">Logged out successfully</h2>
            <p class="text-muted mb-4">You have been signed out from your client account.</p>
            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <a href="{{ url_for('login') }}" class="btn btn-danger fw-bold">Login Again</a>
                <a href="{{ url_for('index') }}" class="btn btn-outline-danger fw-bold">Go Home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
