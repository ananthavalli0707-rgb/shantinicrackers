{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-12 col-sm-8 col-md-5">
        <div class="card shadow p-3 p-sm-4 border-0">
            <p class="section-kicker text-center mb-1">Account recovery</p>
            <h3 class="fw-bold text-center text-danger mb-4">Choose a new password</h3>
            <form method="POST">
                <div class="mb-3">
                    <label for="new-password" class="form-label">New password</label>
                    <input id="new-password" type="password" name="password" class="form-control" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="mb-3">
                    <label for="confirm-password" class="form-label">Confirm new password</label>
                    <input id="confirm-password" type="password" name="confirm_password" class="form-control" autocomplete="new-password" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-danger w-100 fw-bold">Save new password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
