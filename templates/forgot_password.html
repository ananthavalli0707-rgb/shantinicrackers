{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-12 col-sm-8 col-md-5">
        <div class="card shadow p-3 p-sm-4 border-0">
            <p class="section-kicker text-center mb-1">Account recovery</p>
            <h3 class="fw-bold text-center text-danger mb-3">Forgot password?</h3>
            <p class="text-muted text-center small">Enter your account email and we will send you a secure reset link.</p>
            <form method="POST">
                <div class="mb-3">
                    <label for="reset-email" class="form-label">Email address</label>
                    <input id="reset-email" type="email" name="email" class="form-control" autocomplete="email" required>
                </div>
                <button type="submit" class="btn btn-danger w-100 fw-bold">Send reset link</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
