{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card shadow p-4 border-0">
            <p class="section-kicker text-center mb-1">Start your estimate</p>
            <h3 class="fw-bold text-center text-danger mb-4">Create Account</h3>
            <form action="/signup" method="POST">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" autocomplete="name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email <span class="text-muted small">(Optional)</span></label>
                    <input type="email" name="email" class="form-control" autocomplete="email">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mobile Number</label>
                    <input type="tel" name="phone" class="form-control" inputmode="numeric" autocomplete="tel" pattern="[0-9]{7,15}" placeholder="9786361678" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-danger w-100 fw-bold">Register Account</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
